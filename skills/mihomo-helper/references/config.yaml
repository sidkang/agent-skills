rules:
  # 模板的内网域名例外；部署前核对，用户确认的额外例外也放在服务规则之前。
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  # 每条代理规则紧跟同范围 UDP 拒绝：节点不支持 UDP 时不继续落到直连。
  # 新增规则亦须成对；显式选择 DIRECT 时第一条直接生效，不触发拒绝。
  - DOMAIN-SUFFIX,github.com,PROXY
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,github.com)),REJECT
  - DOMAIN-SUFFIX,githubusercontent.com,PROXY
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,githubusercontent.com)),REJECT
  - DOMAIN-SUFFIX,githubassets.com,PROXY
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,githubassets.com)),REJECT
  - RULE-SET,github,PROXY
  - AND,((NETWORK,udp),(RULE-SET,github)),REJECT
  - RULE-SET,youtube,PROXY
  - AND,((NETWORK,udp),(RULE-SET,youtube)),REJECT
  - RULE-SET,netflix,NETFLIX
  - AND,((NETWORK,udp),(RULE-SET,netflix)),REJECT
  # AI 专属域名先于通用 Google；共享登录域名也会影响其他 Google 服务。
  - DOMAIN-SUFFIX,gemini.google.com,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,gemini.google.com)),REJECT
  - DOMAIN,aistudio.google.com,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN,aistudio.google.com)),REJECT
  - DOMAIN,ai.google.dev,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN,ai.google.dev)),REJECT
  - DOMAIN,generativelanguage.googleapis.com,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN,generativelanguage.googleapis.com)),REJECT
  - DOMAIN,accounts.google.com,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN,accounts.google.com)),REJECT
  - DOMAIN,oauth2.googleapis.com,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN,oauth2.googleapis.com)),REJECT
  - DOMAIN-SUFFIX,antigravity.google,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,antigravity.google)),REJECT
  - DOMAIN,cloudcode-pa.googleapis.com,GOOGLE
  - AND,((NETWORK,udp),(DOMAIN,cloudcode-pa.googleapis.com)),REJECT
  # 语音 IP、第三方认证和远程开发流量按实际连接补充，不能视为完整清单。
  - DOMAIN-SUFFIX,chatgpt.com,CHATGPT
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,chatgpt.com)),REJECT
  - DOMAIN-SUFFIX,openai.com,CHATGPT
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,openai.com)),REJECT
  - DOMAIN-SUFFIX,oaistatic.com,CHATGPT
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,oaistatic.com)),REJECT
  - DOMAIN-SUFFIX,oaiusercontent.com,CHATGPT
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,oaiusercontent.com)),REJECT
  - DOMAIN-SUFFIX,oaistatsig.com,CHATGPT
  - AND,((NETWORK,udp),(DOMAIN-SUFFIX,oaistatsig.com)),REJECT
  - DOMAIN,cdn.openaimerge.com,CHATGPT
  - AND,((NETWORK,udp),(DOMAIN,cdn.openaimerge.com)),REJECT
  - RULE-SET,google,GOOGLE
  - AND,((NETWORK,udp),(RULE-SET,google)),REJECT
  - RULE-SET,stream_us,US
  - AND,((NETWORK,udp),(RULE-SET,stream_us)),REJECT
  - RULE-SET,stream_jp,JP
  - AND,((NETWORK,udp),(RULE-SET,stream_jp)),REJECT
  - RULE-SET,stream_tw,TW
  - AND,((NETWORK,udp),(RULE-SET,stream_tw)),REJECT
  - RULE-SET,stream_hk,HK
  - AND,((NETWORK,udp),(RULE-SET,stream_hk)),REJECT
  - RULE-SET,stream_other,STREAM
  - AND,((NETWORK,udp),(RULE-SET,stream_other)),REJECT
  # IP 规则放在非 IP 规则之后。
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - RULE-SET,stream_ip,STREAM
  - AND,((NETWORK,udp),(RULE-SET,stream_ip)),REJECT
  - RULE-SET,china_ip,DIRECT
  # 未指定代理的流量直连，不代表指定代理失败后允许直连。
  - MATCH,DIRECT
