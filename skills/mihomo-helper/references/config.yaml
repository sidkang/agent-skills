# mihomo-helper: managed-template（获准部署后改为 managed，路径填实际值）
# config-path: ~/config/mihomo/config.yml
# binary-path: C:\Program Files\Mihomo\mihomo.exe
# change-log: 追加日期、原因、改动摘要和回滚依据；不记录密钥。
# - 初始模板：尚未接入节点或验证。
# - 2026-09-24：预装 Gemini、Antigravity、ChatGPT 核心域名及 AI 组；回滚移除 AI 组和相应规则。
# - 2026-09-24：v0.0.3 拆分 GOOGLE（默认 JP）与 CHATGPT（默认 US）；回滚使用 v0.0.2 模板。
# - 2026-09-24：v0.0.4 空组拒绝、同范围 UDP 兜底和内网域名例外；回滚参考变更前快照。
# rule-preset: community-wide；远程清单可含关键字/进程/IP，接入前须确认范围。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
# 诊断时才开启 API；仅绑定回环、私下设置随机强 secret。
# external-controller: 127.0.0.1:9090
# secret: 'REPLACE_WITH_PRIVATE_RANDOM_SECRET'

tun:
  enable: true
  stack: mixed
  auto-route: true                # 需要提升权限；避免与其他 TUN 冲突
  auto-detect-interface: true
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  # strict-route: true            # 可能影响虚拟机；不是自动开启项

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:                 # 返回真实 IP，不代表已设为 DIRECT
    - '*.lan'
    - '*.local'
    - 'localhost'
  nameserver:
    - system
  direct-nameserver:
    - system
  proxy-server-nameserver:
    - system                     # 解析节点自身域名，不是目标站域名

proxy-providers:
  subscription:
    type: http
    url: 'https://replace.example/subscription.yaml' # 只填用户授权的 mihomo 节点订阅；密钥勿提交
    path: ./providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: 'https://cp.cloudflare.com'
      interval: 300

proxy-groups:
  - name: AUTO
    type: url-test
    use: [subscription]
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com'
    interval: 300
    tolerance: 100
  # 地区组按顺序故障切换；空组拒绝，不等于所有节点失效时会自动换地区。
  - name: US
    type: fallback
    use: [subscription]
    empty-fallback: REJECT
    filter: '(?i)(美国|美國|美区|🇺🇸|\bUS\b|United States)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: JP
    type: fallback
    use: [subscription]
    empty-fallback: REJECT
    filter: '(?i)(日本|🇯🇵|\bJP\b|Japan)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: TW
    type: fallback
    use: [subscription]
    empty-fallback: REJECT
    filter: '(?i)(台湾|台灣|🇹🇼|\bTW\b|Taiwan)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: HK
    type: fallback
    use: [subscription]
    empty-fallback: REJECT
    filter: '(?i)(香港|🇭🇰|\bHK\b|Hong Kong|HongKong)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: SG
    type: fallback
    use: [subscription]
    empty-fallback: REJECT
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: OTHER
    type: fallback
    use: [subscription]
    empty-fallback: REJECT
    exclude-filter: '(?i)(美国|美國|美区|🇺🇸|\bUS\b|United States|日本|🇯🇵|\bJP\b|Japan|台湾|台灣|🇹🇼|\bTW\b|Taiwan|香港|🇭🇰|\bHK\b|Hong Kong|HongKong|新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: PROXY
    type: select
    proxies: [AUTO, US, JP, TW, HK, SG, OTHER, DIRECT]
  - name: GOOGLE
    type: select
    proxies: [JP, US, SG, TW, OTHER]
  - name: CHATGPT
    type: select
    proxies: [US, JP, SG, TW, OTHER]
  - name: STREAM
    type: select
    proxies: [US, JP, TW, HK, SG, OTHER, AUTO, DIRECT]
  - name: NETFLIX
    type: select
    proxies: [US, JP, TW, HK, SG, OTHER, AUTO, DIRECT]

# 保留既有社区广覆盖预设，并非精确域名白名单。精确模式见 app-routing.md。
