# mihomo-helper: managed-template（获准部署后改为 managed，路径填实际值）
# config-path: ~/config/mihomo/config.yml
# binary-path: C:\Program Files\Mihomo\mihomo.exe
# change-log: 追加日期、原因、改动摘要和回滚依据；不记录密钥。
# - 初始模板：尚未接入节点或验证。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true
# 诊断时才开启 API；仅绑定回环、私下设置随机强 secret。
# external-controller: 127.0.0.1:9090
# secret: 'REPLACE_WITH_PRIVATE_RANDOM_SECRET'

tun:
  enable: true
  stack: mixed
  auto-route: true                # 需要提升权限；避免与其他 TUN 冲突
  auto-detect-interface: true
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  # strict-route: true            # 可防 Windows 多宿主 DNS 泄漏，但可能影响虚拟机

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:                 # 内网域名返回真实 IP
    - '*.lan'
    - '*.local'
    - 'localhost'
  nameserver:
    - system
  direct-nameserver:
    - system
  proxy-server-nameserver:
    - system                     # 解析节点自身域名，不是目标站域名

proxy-providers:
  subscription:
    type: http
    url: 'https://replace.example/subscription.yaml' # 只填用户授权的 mihomo 节点订阅；密钥勿提交
    path: ./providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: 'https://cp.cloudflare.com'
      interval: 300

proxy-groups:
  - name: AUTO
    type: url-test
    use: [subscription]
    url: 'https://cp.cloudflare.com'
    interval: 300
    tolerance: 100
  # 地区组按顺序故障切换；接入订阅时核对名称、优先级及空组。
  - name: US
    type: fallback
    use: [subscription]
    filter: '(?i)(美国|美國|美区|🇺🇸|\bUS\b|United States)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: JP
    type: fallback
    use: [subscription]
    filter: '(?i)(日本|🇯🇵|\bJP\b|Japan)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: TW
    type: fallback
    use: [subscription]
    filter: '(?i)(台湾|台灣|🇹🇼|\bTW\b|Taiwan)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: HK
    type: fallback
    use: [subscription]
    filter: '(?i)(香港|🇭🇰|\bHK\b|Hong Kong|HongKong)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: SG
    type: fallback
    use: [subscription]
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: OTHER
    type: fallback
    use: [subscription]
    # 排除以上五区，其余归 OTHER。
    exclude-filter: '(?i)(美国|美國|美区|🇺🇸|\bUS\b|United States|日本|🇯🇵|\bJP\b|Japan|台湾|台灣|🇹🇼|\bTW\b|Taiwan|香港|🇭🇰|\bHK\b|Hong Kong|HongKong|新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: PROXY
    type: select
    proxies: [AUTO, US, JP, TW, HK, SG, OTHER, DIRECT]
  - name: STREAM
    type: select
    proxies: [US, JP, TW, HK, SG, OTHER, AUTO, DIRECT]
  - name: NETFLIX
    type: select
    proxies: [US, JP, TW, HK, SG, OTHER, AUTO, DIRECT]

rule-providers:
  github:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list'
    path: ./rules/github.list
    interval: 43200
  youtube:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list'
    path: ./rules/youtube.list
    interval: 43200
  google:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list'
    path: ./rules/google.list
    interval: 43200
  netflix:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list'
    path: ./rules/netflix.list
    interval: 43200
  stream_us:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_us.txt'
    path: ./rules/stream_us.txt
    interval: 43200
  stream_jp:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_jp.txt'
    path: ./rules/stream_jp.txt
    interval: 43200
  stream_tw:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_tw.txt'
    path: ./rules/stream_tw.txt
    interval: 43200
  stream_hk:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_hk.txt'
    path: ./rules/stream_hk.txt
    interval: 43200
  stream_other:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream.txt'
    path: ./rules/stream_other.txt
    interval: 43200
  stream_ip:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/ip/stream.txt'
    path: ./rules/stream_ip.txt
    interval: 43200
  lan_ip:
    type: http
    behavior: classical            # 含 DOMAIN 和 IP-CIDR，不是纯 CIDR
    format: text
    url: 'https://ruleset.skk.moe/Clash/ip/lan.txt'
    path: ./rules/lan_ip.txt
    interval: 43200
  china_ip:
    type: http
    behavior: ipcidr
    format: text
    url: 'https://ruleset.skk.moe/Clash/ip/china_ip.txt'
    path: ./rules/china_ip.txt
    interval: 43200

rules:
  # 新增精确应用规则放在这里；IP 类规则放到域名规则之后。
  # - 'PROCESS-PATH,C:\Program Files\Vendor\App\app.exe,US'
  # GitHub 内置规则不依赖远程规则文件加载。
  - DOMAIN-SUFFIX,github.com,PROXY
  - DOMAIN-SUFFIX,githubusercontent.com,PROXY
  - DOMAIN-SUFFIX,githubassets.com,PROXY
  - RULE-SET,github,PROXY
  - RULE-SET,youtube,PROXY
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,google,PROXY
  - RULE-SET,stream_us,US
  - RULE-SET,stream_jp,JP
  - RULE-SET,stream_tw,TW
  - RULE-SET,stream_hk,HK
  - RULE-SET,stream_other,STREAM
  # IP 规则放在非 IP 规则之后。
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - RULE-SET,stream_ip,STREAM
  - RULE-SET,china_ip,DIRECT
  # 白名单兜底：未命中代理规则的一律直连。
  - MATCH,DIRECT
