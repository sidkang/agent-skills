# Windows x64 独立 mihomo 核心：TUN + Fake IP + 白名单分流参考配置。
# 这是模板，不含可用节点。使用前必须按 SKILL.md 接入用户自己的节点，并检查各地区组非空。
# 白名单指“只有明确命中的服务/应用走代理”，不是 DNS fake-ip-filter-mode: whitelist。
# TUN 会接管流量，但不会将所有流量送往代理：末尾 MATCH,DIRECT。

mixed-port: 7890                  # 可选本地 HTTP/SOCKS 入口；TUN 不依赖系统代理
allow-lan: false                  # 不对局域网设备开放代理端口
mode: rule                        # 必须保持 rule，不能切换为 global
log-level: info
ipv6: false                       # 先避免 Windows IPv6 旁路；如需 IPv6 须单独检查路由与 DNS
find-process-mode: strict         # 后续按 Windows exe 精确添加进程规则时使用
profile:
  store-selected: true            # 记住用户在 select 策略组中选择的地区
  store-fake-ip: true             # 重启后尽量保留 Fake IP 与域名映射
# 诊断时才开启 API；仅绑定回环、私下设置随机强 secret。
# external-controller: 127.0.0.1:9090
# secret: 'REPLACE_WITH_PRIVATE_RANDOM_SECRET'

tun:
  enable: true
  stack: mixed                    # 官方 TUN 文档推荐的默认起点；防火墙需允许 mihomo
  auto-route: true                # 修改 Windows 路由，需要相应权限；勿与另一套 TUN 同时使用
  auto-detect-interface: true
  dns-hijack:
    - 'any:53'                    # UDP/53（不保证捕获局域网 DNS）
    - 'tcp://any:53'              # TCP/53
  # strict-route: true            # Windows 可阻止多宿主 DNS 泄漏，但可能影响 VirtualBox 等；先核对环境
  # 不写 auto-redirect：官方文档注明它是 Linux 专用项

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip          # TUN 捕获的 DNS 返回 Fake IP，保留域名供域名规则先匹配
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:                 # 局域网/设备发现域名返回真实 IP；不是代理白名单
    - '*.lan'
    - '*.local'
    - 'localhost'
  nameserver:
    - system                     # 未命中代理域名或直连时采用系统/网络 DNS，利于国内 CDN
  direct-nameserver:
    - system                     # DIRECT 实际连接的域名由系统 DNS 解析
  proxy-server-nameserver:
    - system                     # 仅解析代理节点自身域名；依用户网络替换，不是目标站 DNS
  # 浏览器内置 DoH、DoT/DoQ、局域网 DNS 或其他未经过 TUN 的流量未必被 53 端口劫持。
  # 不能承诺“零 DNS 泄漏”；需结合实际 Windows 网络、DNS 与连接记录诊断。

proxy-providers:
  subscription:
    type: http
    url: 'https://replace.example/subscription.yaml' # 只填用户授权的 mihomo 节点订阅；密钥勿提交
    path: ./providers/subscription.yaml
    interval: 86400               # 每天自动更新节点；不是导入上游完整配置
    health-check:
      enable: true
      url: 'https://cp.cloudflare.com'
      interval: 300

proxy-groups:
  - name: AUTO
    type: url-test
    use: [subscription]
    url: 'https://cp.cloudflare.com'
    interval: 300
    tolerance: 100
  # 地区靠节点名称筛选；实际订阅命名可能不同，接入时必须核对每组节点。
  - name: US
    type: url-test
    use: [subscription]
    filter: '(?i)(美国|美國|美区|🇺🇸|\bUS\b|United States)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: JP
    type: url-test
    use: [subscription]
    filter: '(?i)(日本|🇯🇵|\bJP\b|Japan)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: TW
    type: url-test
    use: [subscription]
    filter: '(?i)(台湾|台灣|🇹🇼|\bTW\b|Taiwan)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: HK
    type: url-test
    use: [subscription]
    filter: '(?i)(香港|🇭🇰|\bHK\b|Hong Kong|HongKong)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: SG
    type: url-test
    use: [subscription]
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: OTHER
    type: url-test
    use: [subscription]
    # 不使用 Go/RE2 不支持的负向前瞻；过滤掉以上五区，剩余节点归 OTHER。
    exclude-filter: '(?i)(美国|美國|美区|🇺🇸|\bUS\b|United States|日本|🇯🇵|\bJP\b|Japan|台湾|台灣|🇹🇼|\bTW\b|Taiwan|香港|🇭🇰|\bHK\b|Hong Kong|HongKong|新加坡|狮城|獅城|🇸🇬|\bSG\b|Singapore)'
    url: 'https://cp.cloudflare.com'
    interval: 300
  - name: PROXY
    type: select
    proxies: [AUTO, US, JP, TW, HK, SG, OTHER, DIRECT]
  - name: STREAM
    type: select
    proxies: [US, JP, TW, HK, SG, OTHER, AUTO, DIRECT]
  - name: NETFLIX
    type: select
    proxies: [US, JP, TW, HK, SG, OTHER, AUTO, DIRECT]

rule-providers:
  # blackmatrix7 的 Clash .list 为 classical/text；服务规则按域名优先匹配。
  youtube:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.list'
    path: ./rules/youtube.list
    interval: 43200
  google:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list'
    path: ./rules/google.list
    interval: 43200
  netflix:
    type: http
    behavior: classical
    format: text
    url: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.list'
    path: ./rules/netflix.list
    interval: 43200
  # Sukka 的 Clash 版本；不可把 Surge List/*.conf 当作 mihomo provider。
  stream_us:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_us.txt'
    path: ./rules/stream_us.txt
    interval: 43200
  stream_jp:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_jp.txt'
    path: ./rules/stream_jp.txt
    interval: 43200
  stream_tw:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_tw.txt'
    path: ./rules/stream_tw.txt
    interval: 43200
  stream_hk:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream_hk.txt'
    path: ./rules/stream_hk.txt
    interval: 43200
  stream_other:
    type: http
    behavior: classical
    format: text
    url: 'https://ruleset.skk.moe/Clash/non_ip/stream.txt'
    path: ./rules/stream_other.txt
    interval: 43200
  # 一些流媒体使用 IP 直连；IP 规则必须排在全部域名/非 IP 规则之后。
  stream_ip:
    type: http
    behavior: classical            # Sukka 的 Clash/ip/stream.txt 是经典规则格式
    format: text
    url: 'https://ruleset.skk.moe/Clash/ip/stream.txt'
    path: ./rules/stream_ip.txt
    interval: 43200
  # CN / 内网直连不借用 geosite:cn：使用 Sukka 的内网及中国 IP 列表。
  lan_ip:
    type: http
    behavior: classical            # Sukka 的 Clash/ip/lan.txt 含 DOMAIN 和 IP-CIDR，不是纯 CIDR
    format: text
    url: 'https://ruleset.skk.moe/Clash/ip/lan.txt'
    path: ./rules/lan_ip.txt
    interval: 43200
  china_ip:
    type: http
    behavior: ipcidr
    format: text
    url: 'https://ruleset.skk.moe/Clash/ip/china_ip.txt'
    path: ./rules/china_ip.txt
    interval: 43200

rules:
  # 新增应用规则放在这里：精确域名/进程优先，IP 类规则靠后；需先确认其流量确实被 TUN 捕获。
  # - 'PROCESS-PATH,C:\Program Files\Vendor\App\app.exe,US'
  # 非 IP：域名规则先匹配，命中代理不必为目标站做本地 DNS 解析。
  - RULE-SET,youtube,PROXY
  - RULE-SET,netflix,NETFLIX
  - RULE-SET,google,PROXY
  - RULE-SET,stream_us,US
  - RULE-SET,stream_jp,JP
  - RULE-SET,stream_tw,TW
  - RULE-SET,stream_hk,HK
  - RULE-SET,stream_other,STREAM
  # IP：先为内网保底；已是 IP 的目的地可匹配流媒体 IP。
  - RULE-SET,lan_ip,DIRECT,no-resolve
  - RULE-SET,stream_ip,STREAM
  # 国内 IP 直连；不匹配的国内域名也由最终 DIRECT 处理。
  - RULE-SET,china_ip,DIRECT
  # 最终兜底始终直连；严禁把这条改成 PROXY（否则不再是白名单）。
  - MATCH,DIRECT
